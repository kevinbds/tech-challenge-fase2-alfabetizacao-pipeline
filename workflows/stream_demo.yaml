main:
  params: [args]
  steps:
    - require_map_input:
        switch:
          - condition: ${get_type(args) != "map"}
            raise: "A entrada deve ser um objeto com release_year e action opcional"
    - validate_input_keys:
        assign:
          - input_keys: ${keys(args)}
    - require_supported_input:
        switch:
          - condition: >-
              ${len(input_keys) > 2 or not("release_year" in input_keys) or
              (len(input_keys) == 2 and not("action" in input_keys))}
            raise: "Somente release_year e action são aceitos"
    - read_input:
        assign:
          - action: ${default(map.get(args, "action"), "run")}
          - release_year: ${map.get(args, "release_year")}
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - flex_template_spec_gcs_uri: ${sys.get_env("ALFABETIZACAO_FLEX_TEMPLATE_URI")}
          - dataflow_subscription: ${sys.get_env("ALFABETIZACAO_DATAFLOW_SUBSCRIPTION")}
          - valid_staging_table: ${sys.get_env("ALFABETIZACAO_VALID_TABLE")}
          - quarantine_table: ${sys.get_env("ALFABETIZACAO_QUARANTINE_TABLE")}
          - dataflow_service_account: ${sys.get_env("ALFABETIZACAO_DATAFLOW_SERVICE_ACCOUNT")}
          - dataflow_sdk_container_image: ${sys.get_env("ALFABETIZACAO_DATAFLOW_SDK_CONTAINER_IMAGE")}
          - temp_location: ${sys.get_env("ALFABETIZACAO_DATAFLOW_TEMP_LOCATION")}
          - staging_location: ${sys.get_env("ALFABETIZACAO_DATAFLOW_STAGING_LOCATION")}
          - producer_job_name: ${sys.get_env("ALFABETIZACAO_PRODUCER_JOB")}
          - topic: ${sys.get_env("ALFABETIZACAO_TOPIC")}
          - raw_archive_bucket: ${sys.get_env("ALFABETIZACAO_RAW_ARCHIVE_BUCKET")}
          - raw_archive_prefix: ${sys.get_env("ALFABETIZACAO_RAW_ARCHIVE_PREFIX")}
          - dbt_job_name: ${sys.get_env("ALFABETIZACAO_DBT_JOB")}
          - maximum_bytes_billed: ${sys.get_env("ALFABETIZACAO_MAXIMUM_BYTES_BILLED")}
          - data_location: ${sys.get_env("ALFABETIZACAO_DATA_LOCATION")}
          - gold_table: ${sys.get_env("ALFABETIZACAO_GOLD_TABLE")}
          - duplicate_audit_table: ${sys.get_env("ALFABETIZACAO_DUPLICATE_AUDIT_TABLE")}
          - backlog_subscription_ids: ${json.decode(sys.get_env("ALFABETIZACAO_BACKLOG_SUBSCRIPTION_IDS"))}
          - correlation_id: ${uuid.generate()}
          - job_name: ${"literacy-demo-" + text.substring(text.replace_all(correlation_id, "-", ""), 0, 24)}
          - window_start: ${time.format(sys.now())}
          - dataflow_job_id: null
          - valid_query_table: ${text.replace_all(valid_staging_table, ":", ".")}
          - quarantine_query_table: ${text.replace_all(quarantine_table, ":", ".")}
          - silver_query: ${"SELECT COUNT(DISTINCT event_id) FROM `" + valid_query_table + "` WHERE correlation_id = @correlation_id AND ingestion_time >= @window_start"}
          - quarantine_query: ${"SELECT COUNT(DISTINCT event_fingerprint) FROM `" + quarantine_query_table + "` WHERE correlation_id = @correlation_id AND ingestion_time >= @window_start"}
          - duplicate_query: ${"SELECT COUNT(*) FROM `" + duplicate_audit_table + "` WHERE correlation_id = @correlation_id AND ingestion_time >= @window_start"}
          - gold_query: ${"SELECT COUNT(*) FROM `" + gold_table + "` WHERE correlation_id = @correlation_id AND origem = 'stream_simulacao'"}
          - release_query: >-
              ${"SELECT COUNT(*) FROM `" + project_id + ".ops.active_release` AS active " +
              "JOIN `" + project_id + ".ops.release_registry` AS registry " +
              "ON active.release_id = registry.release_id " +
              "WHERE active.singleton_key = TRUE " +
              "AND active.release_id != '__bootstrap__' " +
              "AND registry.status = 'active' " +
              "AND registry.reference_year = @release_year"}
    - require_supported_values:
        switch:
          - condition: ${get_type(release_year) != "integer" or release_year != 2024}
            raise: "release_year deve ser 2024 para a fixture oficial da demonstração"
          - condition: ${action != "run"}
            raise: "A única action aceita é run"
    - check_active_release:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project_id}
          body:
            useLegacySql: false
            query: ${release_query}
            location: ${data_location}
            maximumBytesBilled: ${maximum_bytes_billed}
            timeoutMs: 30000
            parameterMode: NAMED
            queryParameters:
              - {name: release_year, parameterType: {type: INT64}, parameterValue: {value: '${string(release_year)}'}}
        result: release_result
    - normalize_active_release:
        assign:
          - release_query_complete: ${default(map.get(release_result, "jobComplete"), false)}
          - release_rows: ${default(map.get(release_result, "rows"), [])}
    - require_active_release_shape:
        switch:
          - condition: ${not(release_query_complete) or len(release_rows) != 1 or len(default(map.get(release_rows[0], "f"), [])) != 1}
            raise: "Não foi possível validar a release ativa"
    - read_active_release_count:
        assign:
          - active_release_count: ${int(release_rows[0].f[0].v)}
    - require_active_release:
        switch:
          - condition: ${active_release_count != 1}
            raise: "A demo exige uma release ativa do mesmo ano informado"
    - guarded_execution:
        try:
          steps:
            - launch_flex:
                call: googleapis.dataflow.v1b3.projects.locations.flexTemplates.launch
                args:
                  projectId: ${project_id}
                  location: ${region}
                  body:
                    launchParameter:
                      jobName: ${job_name}
                      containerSpecGcsPath: ${flex_template_spec_gcs_uri}
                      parameters:
                        input_subscription: ${dataflow_subscription}
                        valid_table: ${valid_staging_table}
                        quarantine_table: ${quarantine_table}
                      environment:
                        serviceAccountEmail: ${dataflow_service_account}
                        sdkContainerImage: ${dataflow_sdk_container_image}
                        tempLocation: ${temp_location}
                        stagingLocation: ${staging_location}
                        numWorkers: 1
                        maxWorkers: 2
                        workerRegion: '${region}'
                        enableStreamingEngine: true
                        diskSizeGb: 30
                        additionalPipelineOptions:
                          - dataflow_service_options=enable_streaming_engine_resource_based_billing
                        additionalExperiments: [enable_portable_runner]
                        additionalUserLabels: {run_id: '${correlation_id}'}
                result: launch_result
            - remember_job:
                assign:
                  - dataflow_job_id: ${launch_result.job.id}
            - wait_running:
                call: wait_dataflow_state
                args: {project_id: '${project_id}', region: '${region}', job_id: '${dataflow_job_id}', target_state: JOB_STATE_RUNNING, max_attempts: 60}
                result: running_result
            - require_running:
                switch:
                  - condition: ${not(running_result.success)}
                    raise: '${"Dataflow não alcançou RUNNING: " + running_result.final_state}'
            - publish_fixture:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${producer_job_name}
                  connector_params: {timeout: 990}
                  body:
                    overrides:
                      containerOverrides:
                        - args: [--mode, pubsub, --topic, '${topic}', --fixture, /app/contracts/events/fixtures/demo.json, --report, /tmp/producer-report.json, --year, '${string(release_year)}']
                          env:
                            - name: CORRELATION_ID
                              value: '${correlation_id}'
            - independent_stage_checks:
                parallel:
                  branches:
                    - staging_branch:
                        steps:
                          - wait_silver:
                              call: wait_bigquery_count
                              args: {project_id: '${project_id}', query: '${silver_query}', expected: 8, correlation_id: '${correlation_id}', window_start: '${window_start}', maximum_bytes_billed: '${maximum_bytes_billed}', data_location: '${data_location}', max_attempts: 60}
                              result: silver_result
                          - require_silver:
                              switch:
                                - condition: ${not(silver_result.success)}
                                  raise: "O staging não materializou oito eventos lógicos correlacionados"
                    - quarantine_branch:
                        steps:
                          - wait_quarantine:
                              call: wait_bigquery_count
                              args: {project_id: '${project_id}', query: '${quarantine_query}', expected: 1, correlation_id: '${correlation_id}', window_start: '${window_start}', maximum_bytes_billed: '${maximum_bytes_billed}', data_location: '${data_location}', max_attempts: 60}
                              result: quarantine_result
                          - require_quarantine:
                              switch:
                                - condition: ${not(quarantine_result.success)}
                                  raise: "A quarentena não registrou o evento inválido correlacionado"
                    - raw_archive_branch:
                        steps:
                          - wait_raw_avro:
                              call: wait_gcs_object
                              args: {bucket: '${raw_archive_bucket}', prefix: '${raw_archive_prefix + "/"}', window_start: '${window_start}', max_attempts: 18, max_pages: 10}
                              result: raw_result
                          - require_raw:
                              switch:
                                - condition: ${not(raw_result.success)}
                                  raise: "Arquivo raw Avro da janela da execução não apareceu"
            - request_drain:
                call: googleapis.dataflow.v1b3.projects.locations.jobs.update
                args:
                  projectId: ${project_id}
                  location: ${region}
                  jobId: ${dataflow_job_id}
                  body: {requestedState: JOB_STATE_DRAINED}
                  connector_params: {timeout: 30}
            - wait_drained:
                call: wait_dataflow_state
                args: {project_id: '${project_id}', region: '${region}', job_id: '${dataflow_job_id}', target_state: JOB_STATE_DRAINED, max_attempts: 90}
                result: drained_result
            - require_drained:
                switch:
                  - condition: ${not(drained_result.success)}
                    raise: '${"Drain falhou: " + drained_result.final_state}'
            - build_stream_models:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${dbt_job_name}
                  body:
                    overrides:
                      containerOverrides:
                        - args: [build, --target, cloud, --project-dir, dbt, --profiles-dir, dbt, --select, 'tag:stream_demo']
                          env:
                            - {name: CORRELATION_ID, value: '${correlation_id}'}
                            - {name: RUN_STARTED, value: '${window_start}'}
                  connector_params: {timeout: 3900}
            - check_final_evidence:
                parallel:
                  branches:
                    - duplicate_branch:
                        steps:
                          - check_duplicate:
                              call: wait_bigquery_count
                              args: {project_id: '${project_id}', query: '${duplicate_query}', expected: 1, correlation_id: '${correlation_id}', window_start: '${window_start}', maximum_bytes_billed: '${maximum_bytes_billed}', data_location: '${data_location}', max_attempts: 6}
                              result: duplicate_result
                          - require_duplicate:
                              switch:
                                - condition: ${not(duplicate_result.success)}
                                  raise: "A auditoria não registrou exatamente uma duplicata"
                    - gold_branch:
                        steps:
                          - check_gold:
                              call: wait_bigquery_count
                              args: {project_id: '${project_id}', query: '${gold_query}', expected: 8, correlation_id: '${correlation_id}', window_start: '${window_start}', maximum_bytes_billed: '${maximum_bytes_billed}', data_location: '${data_location}', max_attempts: 6}
                              result: gold_result
                          - require_gold:
                              switch:
                                - condition: ${not(gold_result.success)}
                                  raise: "A Gold não expôs exatamente oito indicadores da simulação"
                    - backlog_branch:
                        steps:
                          - wait_main_backlogs:
                              call: wait_main_subscription_backlogs
                              args:
                                project_id: '${project_id}'
                                main_subscription_ids: '${[backlog_subscription_ids[0], backlog_subscription_ids[1]]}'
                                window_start: '${window_start}'
                                max_attempts: 36
                              result: main_backlog_result
                          - require_empty_main_backlogs:
                              switch:
                                - condition: ${not(main_backlog_result.success)}
                                  raise: "Há backlog nas assinaturas principais"
                          - wait_dead_letter_window:
                              call: wait_no_dead_letter_events
                              args:
                                project_id: '${project_id}'
                                dlq_metric_subscription_ids: '${[backlog_subscription_ids[0], backlog_subscription_ids[1]]}'
                                window_start: '${window_start}'
                              result: dead_letter_result
                          - require_no_dead_letter_events:
                              switch:
                                - condition: ${not(dead_letter_result.success)}
                                  raise: "Houve encaminhamento para dead letter na execução"
        except:
          as: workflow_error
          steps:
            - cleanup_after_failure:
                try:
                  call: cleanup_dataflow
                  args: {project_id: '${project_id}', region: '${region}', job_id: '${dataflow_job_id}', job_name: '${job_name}', correlation_id: '${correlation_id}'}
                except:
                  as: cleanup_error
                  steps:
                    - record_cleanup_failure:
                        try:
                          steps:
                            - write_cleanup_log:
                                call: sys.log
                                args:
                                  severity: ERROR
                                  text: "A limpeza do Dataflow falhou; preservando o erro original"
                        except:
                          as: logging_error
                          steps:
                            - preserve_workflow_error:
                                raise: ${workflow_error}
            - preserve_failure:
                raise: ${workflow_error}
    - complete:
        return: {dataflow_job_id: '${dataflow_job_id}', correlation_id: '${correlation_id}', final_state: '${drained_result.final_state}', success: true}

cleanup_dataflow:
  params: [project_id, region, job_id, job_name, correlation_id]
  steps:
    - route_by_id:
        switch:
          - condition: ${job_id != null}
            next: inspect_known
        next: init_discovery
    - init_discovery:
        assign:
          - discovery_scan: 1
          - discovery_deadline: ${sys.now() + 120}
    - init_page_scan:
        assign:
          - page_token: ""
          - next_page_token: ""
          - page_count: 1
          - visited_page_tokens: [""]
          - matched_job_id: null
          - duplicate_match: false
    - list_active_jobs:
        call: googleapis.dataflow.v1b3.projects.locations.jobs.list
        args:
          projectId: ${project_id}
          location: ${region}
          filter: ACTIVE
          pageSize: 100
          pageToken: ${page_token}
          connector_params: {timeout: 30}
        result: active_jobs
    - validate_listing:
        switch:
          - condition: '${get_type(default(map.get(active_jobs, "jobs"), [])) != "list"}'
            next: no_matching_job
    - init_search:
        assign:
          - candidate_index: 0
          - candidate_count: ${len(default(map.get(active_jobs, "jobs"), []))}
    - search_done:
        switch:
          - condition: ${candidate_index >= candidate_count}
            next: capture_next_page
    - inspect_candidate:
        assign:
          - candidate: ${active_jobs.jobs[candidate_index]}
        next: validate_candidate
    - validate_candidate:
        switch:
          - condition: '${get_type(candidate) != "map"}'
            next: no_matching_job
        next: inspect_candidate_labels
    - inspect_candidate_labels:
        assign:
          - candidate_labels: ${default(map.get(candidate, "labels"), json.decode("{}"))}
    - candidate_matches:
        switch:
          - condition: '${get_type(candidate_labels) == "map" and candidate.name == job_name and map.get(candidate_labels, "run_id") == correlation_id and get_type(map.get(candidate, "id")) == "string"}'
            next: classify_match
        next: advance_candidate
    - classify_match:
        switch:
          - condition: ${matched_job_id != null}
            next: record_duplicate
        next: record_match
    - record_match:
        assign:
          - matched_job_id: ${candidate.id}
        next: advance_candidate
    - record_duplicate:
        assign:
          - duplicate_match: true
        next: advance_candidate
    - advance_candidate:
        assign:
          - candidate_index: ${candidate_index + 1}
        next: search_done
    - capture_next_page:
        assign:
          - next_page_token: ${default(map.get(active_jobs, "nextPageToken"), "")}
    - validate_next_page:
        switch:
          - condition: '${get_type(next_page_token) != "string"}'
            next: no_matching_job
    - guard_next_page:
        switch:
          - condition: ${sys.now() >= discovery_deadline}
            next: no_matching_job
          - condition: ${next_page_token == ""}
            next: choose_unique_match
          - condition: ${next_page_token in visited_page_tokens}
            next: no_matching_job
          - condition: ${page_count >= 10}
            next: retry_discovery
        next: advance_page
    - advance_page:
        assign:
          - page_token: ${next_page_token}
          - page_count: ${page_count + 1}
          - visited_page_tokens: ${list.concat(visited_page_tokens, next_page_token)}
        next: list_active_jobs
    - choose_unique_match:
        switch:
          - condition: ${duplicate_match}
            next: no_matching_job
          - condition: ${matched_job_id != null}
            next: remember_discovered
        next: retry_discovery
    - remember_discovered:
        assign:
          - job_id: ${matched_job_id}
        next: inspect_known
    - retry_discovery:
        switch:
          - condition: ${discovery_scan >= 12 or sys.now() >= discovery_deadline}
            next: no_matching_job
        next: pause_discovery
    - pause_discovery:
        call: sys.sleep
        args: {seconds: 10}
        next: advance_discovery
    - advance_discovery:
        assign:
          - discovery_scan: ${discovery_scan + 1}
        next: init_page_scan
    - no_matching_job:
        return: {success: true, final_state: JOB_NOT_FOUND}
    - inspect_known:
        call: googleapis.dataflow.v1b3.projects.locations.jobs.get
        args: {projectId: '${project_id}', location: '${region}', jobId: '${job_id}'}
        result: job
    - terminal:
        switch:
          - condition: ${job.currentState == "JOB_STATE_DRAINED" or job.currentState == "JOB_STATE_CANCELLED" or job.currentState == "JOB_STATE_FAILED" or job.currentState == "JOB_STATE_DONE"}
            return: {success: true, final_state: '${job.currentState}'}
    - cancel:
        call: googleapis.dataflow.v1b3.projects.locations.jobs.update
        args:
          projectId: ${project_id}
          location: ${region}
          jobId: ${job_id}
          body: {requestedState: JOB_STATE_CANCELLED}
          connector_params: {timeout: 30}
    - wait_cancelled:
        call: wait_dataflow_state
        args: {project_id: '${project_id}', region: '${region}', job_id: '${job_id}', target_state: JOB_STATE_CANCELLED, max_attempts: 60}
        result: cleanup_result
    - finish: {return: '${cleanup_result}'}

wait_dataflow_state:
  params: [project_id, region, job_id, target_state, max_attempts]
  steps:
    - init: {assign: [{attempt: 1}, {final_state: JOB_STATE_UNKNOWN}]}
    - inspect:
        call: googleapis.dataflow.v1b3.projects.locations.jobs.get
        args: {projectId: '${project_id}', location: '${region}', jobId: '${job_id}'}
        result: job
    - capture: {assign: [{final_state: '${job.currentState}'}]}
    - decide:
        switch:
          - condition: ${final_state == target_state}
            return: {success: true, final_state: '${final_state}'}
          - condition: ${final_state == "JOB_STATE_CANCELLED" or final_state == "JOB_STATE_FAILED" or final_state == "JOB_STATE_DRAINED" or final_state == "JOB_STATE_DONE"}
            return: {success: false, final_state: '${final_state}'}
          - condition: ${attempt >= max_attempts}
            return: {success: false, final_state: '${final_state}'}
    - pause: {call: sys.sleep, args: {seconds: 10}}
    - increment: {assign: [{attempt: '${attempt + 1}'}], next: inspect}

wait_bigquery_count:
  params: [project_id, query, expected, correlation_id, window_start, maximum_bytes_billed, data_location, max_attempts]
  steps:
    - init: {assign: [{attempt: 1}]}
    - query_count:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project_id}
          body:
            useLegacySql: false
            query: ${query}
            location: ${data_location}
            maximumBytesBilled: ${maximum_bytes_billed}
            parameterMode: NAMED
            queryParameters:
              - {name: correlation_id, parameterType: {type: STRING}, parameterValue: {value: '${correlation_id}'}}
              - {name: window_start, parameterType: {type: TIMESTAMP}, parameterValue: {value: '${window_start}'}}
        result: count_result
    - normalize_query_result:
        assign:
          - query_complete: ${default(map.get(count_result, "jobComplete"), false)}
          - query_rows: ${default(map.get(count_result, "rows"), [])}
    - require_count_shape:
        switch:
          - condition: ${query_complete and len(query_rows) == 1 and len(default(map.get(query_rows[0], "f"), [])) == 1}
            next: read_count
          - condition: ${attempt >= max_attempts}
            return: {success: false}
        next: pause
    - read_count:
        assign:
          - observed: ${int(query_rows[0].f[0].v)}
    - decide:
        switch:
          - condition: ${observed == expected}
            return: {success: true}
          - condition: ${attempt >= max_attempts}
            return: {success: false}
    - pause: {call: sys.sleep, args: {seconds: 10}}
    - increment: {assign: [{attempt: '${attempt + 1}'}], next: query_count}

wait_gcs_object:
  params: [bucket, prefix, window_start, max_attempts, max_pages]
  steps:
    - init:
        assign:
          - attempt: 1
          - object_index: 0
          - object_count: 0
          - current_window_object_found: false
          - page_token: ""
          - next_page_token: ""
          - page_count: 1
          - visited_page_tokens: [""]
    - list_objects:
        call: googleapis.storage.v1.objects.list
        args: {bucket: '${bucket}', prefix: '${prefix}', maxResults: 1000, pageToken: '${page_token}'}
        result: objects
    - init_object_scan:
        assign:
          - object_index: 0
          - object_count: ${len(default(map.get(objects, "items"), []))}
          - current_window_object_found: false
    - scan_current_window:
        switch:
          - condition: ${object_index >= object_count}
            next: capture_next_page
        next: inspect_object
    - inspect_object:
        assign:
          - candidate: ${objects.items[object_index]}
    - candidate_is_current:
        switch:
          - condition: ${time.parse(candidate.updated) >= time.parse(window_start)}
            next: mark_current_window_object
        next: advance_object
    - mark_current_window_object:
        assign:
          - current_window_object_found: true
        next: decide
    - advance_object:
        assign:
          - object_index: ${object_index + 1}
        next: scan_current_window
    - capture_next_page:
        assign:
          - next_page_token: ${default(map.get(objects, "nextPageToken"), "")}
    - continue_or_decide:
        switch:
          - condition: ${next_page_token == "" or next_page_token in visited_page_tokens}
            next: decide
          - condition: ${page_count >= max_pages}
            next: decide
        next: advance_page
    - advance_page:
        assign:
          - page_token: ${next_page_token}
          - page_count: ${page_count + 1}
          - visited_page_tokens: ${list.concat(visited_page_tokens, next_page_token)}
        next: list_objects
    - decide:
        switch:
          - condition: ${current_window_object_found}
            return: {success: true}
          - condition: ${attempt >= max_attempts}
            return: {success: false}
    - pause: {call: sys.sleep, args: {seconds: 10}}
    - increment:
        assign:
          - attempt: ${attempt + 1}
          - page_token: ""
          - next_page_token: ""
          - page_count: 1
          - visited_page_tokens: [""]
        next: list_objects

wait_main_subscription_backlogs:
  params: [project_id, main_subscription_ids, window_start, max_attempts]
  steps:
    - init:
        assign:
          - attempt: 1
          - subscription_index: 0
    - choose_subscription:
        switch:
          - condition: ${subscription_index >= len(main_subscription_ids)}
            return: {success: true}
    - split_subscription_id:
        assign:
          - subscription_parts: ${text.split(main_subscription_ids[subscription_index], "/")}
    - read_subscription_name:
        assign:
          - subscription_name: ${subscription_parts[len(subscription_parts) - 1]}
    - verify_subscription_exists:
        call: googleapis.pubsub.v1.projects.subscriptions.get
        args:
          subscription: ${main_subscription_ids[subscription_index]}
    - read_backlog_metric:
        call: http.get
        args:
          url: ${"https://monitoring.googleapis.com/v3/projects/" + project_id + "/timeSeries"}
          auth:
            type: OAuth2
          query:
            filter: '${"metric.type = \"pubsub.googleapis.com/subscription/num_undelivered_messages\" AND resource.type = \"pubsub_subscription\" AND resource.labels.subscription_id = \"" + subscription_name + "\""}'
            interval.startTime: ${window_start}
            interval.endTime: ${time.format(sys.now())}
            view: FULL
            pageSize: 1
        result: backlog_metric
    - normalize_time_series:
        assign:
          - time_series: ${default(map.get(backlog_metric.body, "timeSeries"), [])}
    - require_time_series:
        switch:
          - condition: ${len(time_series) == 0}
            next: retry_or_fail
    - normalize_points:
        assign:
          - metric_points: ${default(map.get(time_series[0], "points"), [])}
    - require_metric_point:
        switch:
          - condition: ${len(metric_points) == 0}
            next: retry_or_fail
    - require_empty_subscription:
        switch:
          - condition: ${int(metric_points[0].value.int64Value) != 0}
            next: retry_or_fail
        next: advance_subscription
    - advance_subscription:
        assign:
          - subscription_index: ${subscription_index + 1}
        next: choose_subscription
    - retry_or_fail:
        switch:
          - condition: ${attempt >= max_attempts}
            return: {success: false}
    - pause_before_retry:
        call: sys.sleep
        args: {seconds: 10}
    - start_next_attempt:
        assign:
          - attempt: ${attempt + 1}
          - subscription_index: 0
        next: choose_subscription

wait_no_dead_letter_events:
  params: [project_id, dlq_metric_subscription_ids, window_start]
  steps:
    - init:
        assign:
          - subscription_index: 0
          - page_token: ""
          - next_page_token: ""
          - dlq_visibility_time: ${sys.now() + 300}
    - wait_for_dlq_visibility:
        call: sys.sleep_until
        args: {time: '${time.format(dlq_visibility_time)}'}
    - choose_subscription:
        switch:
          - condition: ${subscription_index >= len(dlq_metric_subscription_ids)}
            return: {success: true}
    - split_subscription_id:
        assign:
          - subscription_parts: ${text.split(dlq_metric_subscription_ids[subscription_index], "/")}
    - read_subscription_name:
        assign:
          - subscription_name: ${subscription_parts[len(subscription_parts) - 1]}
    - verify_dlq_metric_subscription_exists:
        call: googleapis.pubsub.v1.projects.subscriptions.get
        args:
          subscription: ${dlq_metric_subscription_ids[subscription_index]}
    - read_dead_letter_metric:
        call: http.get
        args:
          url: ${"https://monitoring.googleapis.com/v3/projects/" + project_id + "/timeSeries"}
          auth:
            type: OAuth2
          query:
            filter: '${"metric.type = \"pubsub.googleapis.com/subscription/dead_letter_message_count\" AND resource.type = \"pubsub_subscription\" AND resource.labels.subscription_id = \"" + subscription_name + "\""}'
            interval.startTime: ${window_start}
            interval.endTime: ${time.format(sys.now())}
            view: FULL
            pageSize: 1000
            pageToken: ${page_token}
        result: dead_letter_metric
    - capture_metric_page:
        assign:
          - dlq_time_series: ${default(map.get(dead_letter_metric.body, "timeSeries"), [])}
          - next_page_token: ${default(map.get(dead_letter_metric.body, "nextPageToken"), "")}
          - dlq_series_index: 0
    - choose_series:
        switch:
          - condition: ${dlq_series_index >= len(dlq_time_series)}
            next: next_page_or_advance
        next: normalize_points
    - normalize_points:
        assign:
          - dlq_points: ${default(map.get(dlq_time_series[dlq_series_index], "points"), [])}
          - dlq_point_index: 0
    - choose_point:
        switch:
          - condition: ${dlq_point_index >= len(dlq_points)}
            next: advance_series
    - require_no_dead_letter_events:
        switch:
          - condition: ${int(dlq_points[dlq_point_index].value.int64Value) != 0}
            next: fail_dead_letter_event
    - advance_point:
        assign:
          - dlq_point_index: ${dlq_point_index + 1}
        next: choose_point
    - advance_series:
        assign:
          - dlq_series_index: ${dlq_series_index + 1}
        next: choose_series
    - fail_dead_letter_event:
        return: {success: false}
    - next_page_or_advance:
        switch:
          - condition: ${next_page_token == ""}
            next: advance_subscription
        next: advance_page
    - advance_page:
        assign:
          - page_token: ${next_page_token}
          - next_page_token: ""
        next: read_dead_letter_metric
    - advance_subscription:
        assign:
          - subscription_index: ${subscription_index + 1}
          - page_token: ""
          - next_page_token: ""
        next: choose_subscription
