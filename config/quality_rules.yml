version: 1
catalog: alfabetizacao_release_quality
status: documentary_catalog
executable_source: dbt/models/quality/release_metrics.sql
defaults:
  pass_action: promote
  warning_action: continue_with_alert
  critical_action: quarantine_and_block
rules:
  - id: required_keys
    scope: silver
    metric: null_rate
    pass: "= 0"
    warning: never
    critical: "> 0"
    action: quarantine_and_block
  - id: uniqueness_after_quarantine
    scope: silver
    metric: duplicate_key_rate
    pass: "= 0"
    warning: never
    critical: "> 0"
    action: quarantine_and_block
  - id: relationships
    scope: silver
    metric: matched_reference_rate
    pass: "= 100%"
    warning: never
    critical: "< 100%"
    relations:
      alunos_diretorio_municipio:
        source: silver_alunos
        target: diretorios.municipio
        keys: [id_municipio]
        domain: {release_id: source}
      municipio_diretorio:
        source: silver_municipio
        target: diretorios.municipio
        keys: [id_municipio]
        domain: {release_id: source}
      uf_diretorio:
        source: silver_uf
        target: diretorios.municipio
        keys: [sigla_uf]
        domain: {release_id: source}
      meta_municipio_diretorio:
        source: silver_meta_alfabetizacao_municipio
        target: diretorios.municipio
        keys: [id_municipio]
        domain: {release_id: source}
      meta_uf_diretorio:
        source: silver_meta_alfabetizacao_uf
        target: diretorios.municipio
        keys: [sigla_uf]
        domain: {release_id: source}
      meta_municipio_resultado:
        source: silver_meta_alfabetizacao_municipio
        target: silver_municipio
        keys: [release_id, ano, id_municipio, rede]
        domain: {release_id: source, rede: municipal}
      resultado_uf_meta:
        source: silver_uf
        target: silver_meta_alfabetizacao_uf
        keys: [release_id, ano, sigla_uf, rede]
        domain: {release_id: source, rede: publica}
    release_scoped: true
    action: quarantine_and_block
  - id: gold_core_nulls
    scope: gold
    metric: null_rate
    pass: "= 0"
    warning: never
    critical: "> 0"
    action: block_promotion
  - id: optional_null_delta
    scope: silver
    metric: null_rate_delta_pp
    pass: "<= 5"
    warning: "> 5"
    critical: never
    action: continue_with_alert
  - id: percentage_ranges
    scope: silver
    metric: out_of_range_rows
    columns: [taxa_alfabetizacao, percentual_participacao, proporcao_aluno_nivel_0_8]
    accepted: [0, 100]
    pass: "= 0"
    critical: "> 0"
    action: quarantine_and_block
  - id: non_negative_measurements
    scope: silver_restricted
    metric: negative_rows
    columns: [proficiencia, peso_aluno]
    pass: "= 0"
    critical: "> 0"
    action: quarantine_and_block
  - id: proportions_sum
    scope: silver
    metric: invalid_rows
    accepted: [99.5, 100.5]
    pass: "= 0"
    critical: "> 0"
    action: quarantine_and_block
  - id: repeated_evaluation_or_target_rate
    scope: release
    metric: repeated_rate_percent
    pass: "<= 0.01"
    warning: "> 0.01 and <= 0.50"
    critical: "> 0.50"
    warning_action: continue_with_alert
    critical_action: quarantine_and_block
  - id: partition_volume
    scope: release
    metric: absolute_volume_delta_percent
    pass: "<= 20"
    warning: "> 20 and <= 50"
    critical: "row_count = 0 or drop_percent > 50"
    warning_action: continue_with_alert
    critical_action: block_promotion
  - id: pipeline_freshness
    scope: pipeline
    metric: days_since_success
    pass: "<= 35"
    warning: never
    critical: "> 35"
    action: block_promotion
  - id: identical_duplicate
    scope: silver
    metric: excess_copies
    pass: "= 0"
    warning: "> 0 with one payload hash"
    critical: never
    action: deduplicate_and_alert
  - id: conflicting_duplicate
    scope: silver
    metric: conflicting_business_keys
    pass: "= 0"
    warning: never
    critical: "> 0"
    action: quarantine_and_block
