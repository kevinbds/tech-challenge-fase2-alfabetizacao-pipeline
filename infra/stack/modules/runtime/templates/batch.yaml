main:
  params: [input]
  steps:
    - require_map_input:
        switch:
          - condition: $${get_type(input) != "map"}
            next: reject_input
        next: initialize
    - reject_input:
        raise: "workflow input must be a map with action and year"
    - initialize:
        assign:
          - action: $${default(map.get(input, "action"), "release")}
          - year: $${map.get(input, "year")}
          - sources: [uf, meta_alfabetizacao_brasil, meta_alfabetizacao_uf, meta_alfabetizacao_municipio, municipio, alunos]
          - batch_executions: []
          - release_cleanup_armed: false
    - dispatch_action:
        switch:
          - condition: $${action == "rollback"}
            next: validate_year
          - condition: $${action == "release"}
            next: validate_year
        next: reject_action
    - reject_action:
        raise: '$${"unsupported action: " + action}'
    - validate_year:
        switch:
          - condition: $${get_type(year) != "integer"}
            next: reject_year
          - condition: $${year == null or year < 2000 or year > 2100}
            next: reject_year
        next: route_action
    - reject_year:
        raise: "release year must be between 2000 and 2100"
    - route_action:
        switch:
          - condition: $${action == "rollback"}
            next: rollback_release
        next: prepare_release
    - prepare_release:
        assign:
          - execution_month: $${time.format(sys.now())}
          - release_nonce: $${text.replace_all(uuid.generate(), "-", "")}
          - release_id: $${"batch-" + text.substring(execution_month, 0, 4) + text.substring(execution_month, 5, 7) + "-y" + string(year) + "-r" + release_nonce}
        next: guarded_release
    - rollback_release:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: $${"projects/${project_id}/locations/${region}/jobs/${dbt_job}"}
          body:
            overrides:
              containerOverrides:
                - args: [run-operation, rollback_release, --target, cloud, --project-dir, dbt, --profiles-dir, dbt, --args, '$${json.encode_to_string({"reference_year": year})}']
          connector_params: {timeout: 3900}
        result: rollback_execution
        next: finish_rollback
    - finish_rollback:
        return:
          action: rollback
          year: $${year}
          dbt: $${rollback_execution}
    - guarded_release:
        try:
          steps:
            - arm_release_cleanup:
                assign: [{release_cleanup_armed: true}]
            - begin_release:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: $${"projects/${project_id}/locations/${region}/jobs/${batch_job}"}
                  body:
                    overrides:
                      containerOverrides:
                        - args: [batch, release, begin, --release-id, '$${release_id}', --year, '$${string(year)}']
                  connector_params: {timeout: 3900}
                result: begin_execution
            - run_sources:
                for:
                  value: source
                  in: $${sources}
                  steps:
                    - run_batch:
                        call: googleapis.run.v2.projects.locations.jobs.run
                        args:
                          name: $${"projects/${project_id}/locations/${region}/jobs/${batch_job}"}
                          body:
                            overrides:
                              containerOverrides:
                                - args: [batch, run, --source, '$${source}', --year, '$${string(year)}', --execute, --release-id, '$${release_id}', --format, json]
                          connector_params: {timeout: 3900}
                        result: batch_execution
                    - remember_batch:
                        assign:
                          - batch_executions: $${list.concat(batch_executions, batch_execution)}
            - complete_release:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: $${"projects/${project_id}/locations/${region}/jobs/${batch_job}"}
                  body:
                    overrides:
                      containerOverrides:
                        - args: [batch, release, complete, --release-id, '$${release_id}', --year, '$${string(year)}']
                  connector_params: {timeout: 3900}
                result: complete_execution
            - build_candidate:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: $${"projects/${project_id}/locations/${region}/jobs/${dbt_job}"}
                  body:
                    overrides:
                      containerOverrides:
                        - args: [build, --target, cloud, --project-dir, dbt, --profiles-dir, dbt, --vars, '$${json.encode_to_string({"release_id": release_id})}']
                  connector_params: {timeout: 3900}
                result: dbt_build_execution
            - evaluate_quality:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: $${"projects/${project_id}/locations/${region}/jobs/${dbt_job}"}
                  body:
                    overrides:
                      containerOverrides:
                        - args: [run-operation, evaluate_release, --target, cloud, --project-dir, dbt, --profiles-dir, dbt, --args, '$${json.encode_to_string({"release_id": release_id})}']
                  connector_params: {timeout: 3900}
                result: quality_execution
            - promote_candidate:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: $${"projects/${project_id}/locations/${region}/jobs/${dbt_job}"}
                  body:
                    overrides:
                      containerOverrides:
                        - args: [run-operation, promote_release, --target, cloud, --project-dir, dbt, --profiles-dir, dbt, --args, '$${json.encode_to_string({"release_id": release_id})}']
                  connector_params: {timeout: 3900}
                result: promotion_execution
        except:
          as: release_error
          steps:
            - fail_if_armed:
                switch:
                  - condition: $${release_cleanup_armed}
                    next: fail_release
                next: raise_release_error
            - fail_release:
                try:
                  call: googleapis.run.v2.projects.locations.jobs.run
                  args:
                    name: $${"projects/${project_id}/locations/${region}/jobs/${batch_job}"}
                    body:
                      overrides:
                        containerOverrides:
                          - args: [batch, release, fail, --release-id, '$${release_id}', --year, '$${string(year)}']
                    connector_params: {timeout: 3900}
                  result: fail_execution
                except:
                  as: cleanup_error
                  steps:
                    - log_cleanup_error:
                        try:
                          steps:
                            - write_cleanup_log:
                                call: sys.log
                                args:
                                  severity: ERROR
                                  text: "A limpeza da release falhou; preservando o erro original"
                        except:
                          as: logging_error
                          steps:
                            - preserve_release_error:
                                raise: $${release_error}
                    - preserve_release_error:
                        raise: $${release_error}
            - raise_release_error:
                raise: $${release_error}
    - finish:
        return:
          release_id: $${release_id}
          batch: $${batch_executions}
          dbt_build: $${dbt_build_execution}
          quality: $${quality_execution}
          promotion: $${promotion_execution}
