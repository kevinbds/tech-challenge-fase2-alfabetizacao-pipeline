{
  "version": "1.0",
  "notification_channel": "${NOTIFICATION_CHANNEL_ID}",
  "slos": [],
  "alerts": [
    {"alert_id": "cloud-run-job-failure", "signal_type": "monitoring_metric", "metric_type": "logging.googleapis.com/user/${NAME_PREFIX}-batch_failure", "comparison": "gt", "threshold": "0", "unit": "count", "duration_seconds": 0, "severity": "critical"},
    {"alert_id": "data-quality-test-failure", "signal_type": "monitoring_metric", "metric_type": "logging.googleapis.com/user/${NAME_PREFIX}-data_quality_critical", "comparison": "gt", "threshold": "0", "unit": "count", "duration_seconds": 0, "severity": "critical"},
    {"alert_id": "streaming-latency", "signal_type": "monitoring_metric", "metric_type": "pubsub.googleapis.com/subscription/oldest_unacked_message_age", "comparison": "gte", "threshold": "60", "unit": "second", "duration_seconds": 300, "severity": "critical"},
    {"alert_id": "dataflow-terminal-failure", "signal_type": "monitoring_metric", "metric_type": "dataflow.googleapis.com/job/is_failed", "comparison": "gt", "threshold": "0", "unit": "count", "duration_seconds": 0, "severity": "critical"},
    {"alert_id": "workflow-execution-failure", "signal_type": "monitoring_metric", "metric_type": "workflows.googleapis.com/finished_execution_count", "comparison": "gt", "threshold": "0", "unit": "count", "duration_seconds": 0, "severity": "critical"},
    {"alert_id": "archive-backlog", "signal_type": "monitoring_metric", "metric_type": "pubsub.googleapis.com/subscription/num_undelivered_messages", "comparison": "gt", "threshold": "0", "unit": "count", "duration_seconds": 600, "severity": "warning"},
    {"alert_id": "dataflow-backlog", "signal_type": "monitoring_metric", "metric_type": "pubsub.googleapis.com/subscription/num_undelivered_messages", "comparison": "gt", "threshold": "0", "unit": "count", "duration_seconds": 600, "severity": "warning"},
    {"alert_id": "archive-dlq-not-empty", "signal_type": "monitoring_metric", "metric_type": "pubsub.googleapis.com/subscription/num_undelivered_messages", "comparison": "gt", "threshold": "0", "unit": "count", "duration_seconds": 60, "severity": "critical"},
    {"alert_id": "dataflow-dlq-not-empty", "signal_type": "monitoring_metric", "metric_type": "pubsub.googleapis.com/subscription/num_undelivered_messages", "comparison": "gt", "threshold": "0", "unit": "count", "duration_seconds": 60, "severity": "critical"}
  ]
}
