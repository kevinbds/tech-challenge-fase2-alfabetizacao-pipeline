alfabetizacao_medallion:
  target: offline
  outputs:
    offline:
      type: duckdb
      path: ':memory:'
      threads: 1
    cloud:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: alfabetizacao
      location: "{{ env_var('DBT_LOCATION') }}"
      threads: 4
      priority: interactive
