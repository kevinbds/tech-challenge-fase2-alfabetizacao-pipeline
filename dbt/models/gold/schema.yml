version: 2

models:
  - name: indicador_municipio
    description: Indicador oficial municipal candidato, enriquecido pelo diretório canônico.
    tests:
      - unique_key:
          arguments: {columns: [release_id, ano, id_municipio, rede]}
    columns:
      - name: taxa_alfabetizacao
        description: Percentual oficial de alfabetização.
        data_tests: [not_null]
  - name: comparativo_meta_resultado
    description: Metas anuais municipais, estaduais e nacionais, comparadas ao resultado quando ele já existe.
    tests:
      - unique_key:
          arguments: {columns: [release_id, ano_meta, nivel_geografico, id_geografia, rede]}
    columns:
      - name: ano_meta
        description: Ano da meta; define o grão temporal e a partição da linha.
      - name: ano_resultado
        description: Ano do resultado observado; permanece nulo enquanto a meta for futura.
      - name: nome_geografia
        description: Nome canônico do município ou identificador legível da UF ou do Brasil.
      - name: taxa_resultado
        description: Taxa observada; nula quando ainda não existe resultado para o ano da meta.
      - name: status_meta
        description: Situação da meta medida; nula enquanto não houver resultado.
  - name: evolucao_alfabetizacao
    description: Evolução anual e variação em pontos percentuais por município e rede.
    tests:
      - unique_key:
          arguments: {columns: [release_id, ano, id_municipio, rede]}
  - name: indicador_atual_hibrido
    description: Visão atual que sobrepõe somente simulações posteriores à promoção oficial.
    columns:
      - name: correlation_id
        description: Identificador da execução simulada; nulo quando prevalece o dado oficial.
