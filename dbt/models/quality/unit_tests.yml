version: 2

unit_tests:
  - name: relacionamentos_comparam_somente_redes_equivalentes
    model: relationship_measurements
    given:
      - input: ref('silver_alunos')
        format: sql
        rows: |
          select 'local-release' release_id, 2024 ano, '3550308' id_municipio,
                 'estadual' rede
          union all select 'local-release', 2024, '3550308', 'municipal'
          union all select 'local-release', 2024, '3550308', 'federal'
          union all select 'local-release', 2024, '3550308', 'privada'
      - input: ref('silver_municipio')
        format: sql
        rows: |
          select 'local-release' release_id, 2024 ano, '3550308' id_municipio,
                 'estadual' rede
          union all select 'local-release', 2024, '3550308', 'municipal'
          union all select 'local-release', 2024, '3550308', 'total'
      - input: ref('silver_uf')
        format: sql
        rows: |
          select 'local-release' release_id, 2024 ano, 'SP' sigla_uf, 'publica' rede
          union all select 'local-release', 2024, 'SP', 'estadual'
      - input: ref('silver_meta_alfabetizacao_municipio')
        format: sql
        rows: |
          select 'local-release' release_id, 2024 ano, '3550308' id_municipio,
                 'municipal' rede, 70 meta_alfabetizacao_2024,
                 null meta_alfabetizacao_2025, null meta_alfabetizacao_2026,
                 null meta_alfabetizacao_2027, null meta_alfabetizacao_2028,
                 null meta_alfabetizacao_2029, null meta_alfabetizacao_2030
          union all select 'local-release', 2024, '3550308', 'total', 70,
                 null, null, null, null, null, null
      - input: ref('silver_meta_alfabetizacao_uf')
        format: sql
        rows: |
          select 'local-release' release_id, 2024 ano, 'SP' sigla_uf,
                 'publica' rede, 70 meta_alfabetizacao_2024,
                 null meta_alfabetizacao_2025, null meta_alfabetizacao_2026,
                 null meta_alfabetizacao_2027, null meta_alfabetizacao_2028,
                 null meta_alfabetizacao_2029, null meta_alfabetizacao_2030
          union all select 'local-release', 2024, 'SP', 'estadual', 70,
                 null, null, null, null, null, null
      - input: source('diretorios', 'municipio')
        format: sql
        rows: "select '3550308' id_municipio, 'SP' sigla_uf"
    expect:
      rows:
        - {relation_name: alunos_diretorio_municipio, checked_rows: 4, missing_rows: 0}
        - {relation_name: municipio_diretorio, checked_rows: 3, missing_rows: 0}
        - {relation_name: uf_diretorio, checked_rows: 2, missing_rows: 0}
        - {relation_name: meta_municipio_diretorio, checked_rows: 2, missing_rows: 0}
        - {relation_name: meta_uf_diretorio, checked_rows: 2, missing_rows: 0}
        - {relation_name: meta_municipio_resultado, checked_rows: 1, missing_rows: 0}
        - {relation_name: resultado_uf_meta, checked_rows: 1, missing_rows: 0}

  - name: volume_compara_releases_ao_avancar_ano
    model: release_volume_metric
    given:
      - input: ref('silver_municipio')
        format: sql
        rows: |
          select 'release-2024' release_id, 2024 ano
          union all
          select 'local-release', 2025
      - input: source('ops', 'release_registry')
        format: sql
        rows: |
          select 'local-release' release_id, 'succeeded' status,
                 'release-2024' baseline_release_id
    expect:
      rows:
        - {baseline_count: 1, target_count: 1, volume_delta: 0}

  - name: gold_core_aceita_resultado_nulo_somente_em_meta_futura
    model: release_quality_measurements
    given:
      - input: ref('relationship_measurements')
        format: sql
        rows: |
          select 'local-release' release_id, 'alunos_diretorio_municipio' relation_name, 1 checked_rows, 0 missing_rows
          union all select 'local-release', 'municipio_diretorio', 1, 0
          union all select 'local-release', 'uf_diretorio', 1, 0
          union all select 'local-release', 'meta_municipio_diretorio', 1, 0
          union all select 'local-release', 'meta_uf_diretorio', 1, 0
          union all select 'local-release', 'meta_municipio_resultado', 1, 0
          union all select 'local-release', 'resultado_uf_meta', 1, 0
      - input: ref('indicador_municipio')
        format: sql
        rows: |
          select 'local-release' release_id, 2024 ano, '3550308' id_municipio,
                 'São Paulo' nome_municipio, 'SP' sigla_uf, 'municipal' rede,
                 68 taxa_alfabetizacao
      - input: ref('comparativo_meta_resultado')
        format: sql
        rows: |
          select 'local-release' release_id, 2024 ano_meta,
                 cast(null as integer) ano_resultado, 'municipio' nivel_geografico,
                 '3550308' id_geografia, 'São Paulo' nome_geografia,
                 'municipal' rede, 2024 ano_referencia, 67 meta_alfabetizacao,
                 cast(null as double) taxa_resultado,
                 cast(null as double) gap_pp, cast(null as varchar) status_meta
          union all
          select 'local-release', 2029, null, 'municipio', '3550308',
                 'São Paulo', 'municipal', 2024, 85, null, null, null
          union all
          select 'local-release', 2030, null, 'municipio', '3550308',
                 'São Paulo', 'municipal', 2024, 90, null, null, null
      - input: source('ops', 'release_registry')
        format: sql
        rows: |
          select 'local-release' release_id, 'succeeded' status,
                 2024 reference_year, 'baseline-release' baseline_release_id
      - input: ref('silver_municipio')
        format: sql
        rows: |
          select 'local-release' release_id, 10 media_portugues,
                 68 taxa_alfabetizacao,
                 0 proporcao_aluno_nivel_0, 0 proporcao_aluno_nivel_1,
                 0 proporcao_aluno_nivel_2, 0 proporcao_aluno_nivel_3,
                 0 proporcao_aluno_nivel_4, 0 proporcao_aluno_nivel_5,
                 0 proporcao_aluno_nivel_6, 0 proporcao_aluno_nivel_7,
                 0 proporcao_aluno_nivel_8
          union all
          select 'baseline-release', 10, 60,
                 0, 0, 0, 0, 0, 0, 0, 0, 0
      - input: ref('silver_uf')
        format: sql
        rows: |
          select 'local-release' release_id, 10 media_portugues,
                 70 taxa_alfabetizacao,
                 0 proporcao_aluno_nivel_0, 0 proporcao_aluno_nivel_1,
                 0 proporcao_aluno_nivel_2, 0 proporcao_aluno_nivel_3,
                 0 proporcao_aluno_nivel_4, 0 proporcao_aluno_nivel_5,
                 0 proporcao_aluno_nivel_6, 0 proporcao_aluno_nivel_7,
                 0 proporcao_aluno_nivel_8
      - input: ref('silver_alunos')
        format: sql
        rows: "select 'local-release' release_id, 10 proficiencia, 1 peso_aluno"
      - input: ref('silver_meta_alfabetizacao_municipio')
        format: sql
        rows: |
          select 'local-release' release_id, 68 taxa_alfabetizacao,
                 90 percentual_participacao,
                 67 meta_alfabetizacao_2024, 70 meta_alfabetizacao_2025,
                 75 meta_alfabetizacao_2026, 78 meta_alfabetizacao_2027,
                 80 meta_alfabetizacao_2028, 85 meta_alfabetizacao_2029,
                 90 meta_alfabetizacao_2030
      - input: ref('silver_meta_alfabetizacao_uf')
        format: sql
        rows: |
          select 'local-release' release_id, 70 taxa_alfabetizacao,
                 90 percentual_participacao,
                 69 meta_alfabetizacao_2024, 72 meta_alfabetizacao_2025,
                 75 meta_alfabetizacao_2026, 78 meta_alfabetizacao_2027,
                 80 meta_alfabetizacao_2028, 85 meta_alfabetizacao_2029,
                 90 meta_alfabetizacao_2030
      - input: ref('silver_meta_alfabetizacao_brasil')
        format: sql
        rows: |
          select 'local-release' release_id, 71 taxa_alfabetizacao,
                 90 percentual_participacao,
                 70 meta_alfabetizacao_2024, 73 meta_alfabetizacao_2025,
                 76 meta_alfabetizacao_2026, 79 meta_alfabetizacao_2027,
                 82 meta_alfabetizacao_2028, 86 meta_alfabetizacao_2029,
                 91 meta_alfabetizacao_2030
    expect:
      rows:
        - {checked_rows: 7, missing_rows: 0, expected_relationship_count: 7, actual_relationship_count: 7, distinct_relationship_count: 7, missing_expected_relationship_count: 0, empty_relationship_count: 0, unexpected_relationship_count: 0, gold_row_count: 4, gold_null_count: 1, gold_future_null_count: 2, baseline_rows: 1, optional_null_delta: 0, invalid_measurements: 0}

